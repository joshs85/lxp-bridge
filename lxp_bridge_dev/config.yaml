name: "LXP Bridge (dev)"
version: "dev"
slug: "lxp_bridge_dev"
description: "Allows local communication with Luxpower inverters and bridges it to MQTT"
arch:
  - aarch64
  - amd64
  - armv7
url: "https://github.com/joshs85/lxp-bridge"
init: false
legacy: true
options:
  loglevel: info
  inverters:
  - enabled: true
    host: ""
    port: 8000
    serial: ""
    datalog: ""
    heartbeats: false
    publish_holdings_on_connect: true

  mqtt:
    enabled: true
    host: "localhost"
    port: 1883
    username: ""
    password: ""
    namespace: lxp
    homeassistant_enabled: true
    homeassistant_prefix: homeassistant
    publish_individual_input: true
    max_retries: 3
    circuit_breaker_threshold: 5
    reconnect_delay_secs: 1
    max_reconnect_delay_secs: 300
  scheduler:
    enabled: true
    timesync_cron: "0 0 * * *"
schema:
  loglevel: list(trace|debug|info|warn|error|off)
  inverters:
  - enabled: bool
    host: str
    port: port
    serial: str
    datalog: str
    heartbeats: bool
    publish_holdings_on_connect: bool

  mqtt:
    enabled: bool
    host: str
    port: port
    username: str
    password: password
    namespace: str
    homeassistant_enabled: bool
    homeassistant_prefix: str
    publish_individual_input: bool
    max_retries: int
    circuit_breaker_threshold: int
    reconnect_delay_secs: int
    max_reconnect_delay_secs: int
  scheduler:
    enabled: bool
    timesync_cron: str
